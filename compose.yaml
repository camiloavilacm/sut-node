name: qa-sut-node
services:
  db:
    image: postgres@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_USER: qa
      POSTGRES_DB: qa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 tools/configure.py}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U qa -d qa']
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://qa:${POSTGRES_PASSWORD}@db:5432/qa
      JWT_SECRET: ${JWT_SECRET:?Run python3 tools/configure.py}
    ports:
      - '127.0.0.1:${PORT:-8002}:8000'
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  database:
